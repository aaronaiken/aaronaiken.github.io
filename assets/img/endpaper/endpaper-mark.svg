<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Endpaper">
  <!-- Endpaper "The Gutter" mark, dual-theme. The Workbench card adapts to the OS
       (parchment in light, amber-CRT in dark), so the mark tracks it via prefers-color-scheme. -->
  <style>
    .page { stroke: #2a2418; fill: none; }
    .stripe { stroke: #7a3e00; fill: none; }
    .tint { fill: #7a3e00; fill-opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      .page { stroke: #dfe6ff; }
      .stripe { stroke: #a8d4ff; }
      .tint { fill: #a8d4ff; fill-opacity: 0.16; }
    }
  </style>
  <rect class="tint" x="12" y="8" width="12" height="48"/>
  <rect class="page" x="10.75" y="6.75" width="42.5" height="50.5" rx="1" stroke-width="2.5"/>
  <path class="stripe" d="M24 6.75V57.25" stroke-width="3.5"/>
</svg>
