<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- include favicons.html -%}
  {%- seo -%}
  <script src="{{ '/assets/js/tidy-notify.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <style>
    /* TidyBrew's own type, self-hosted (SIL OFL) — Nunito, Crimson Pro, Share Tech Mono. */
    @font-face{font-family:'TBSans';src:url('/assets/fonts/tidybrew/Nunito-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap;}
    @font-face{font-family:'TBSans';src:url('/assets/fonts/tidybrew/Nunito-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
    @font-face{font-family:'TBSans';src:url('/assets/fonts/tidybrew/Nunito-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap;}
    @font-face{font-family:'TBSans';src:url('/assets/fonts/tidybrew/Nunito-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
    @font-face{font-family:'TBSerif';src:url('/assets/fonts/tidybrew/CrimsonPro-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;}
    @font-face{font-family:'TBSerif';src:url('/assets/fonts/tidybrew/CrimsonPro-Italic.ttf') format('truetype');font-weight:400;font-style:italic;font-display:swap;}
    @font-face{font-family:'TBMono';src:url('/assets/fonts/tidybrew/ShareTechMono-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}

    /* Roasted-brown on a warm near-black — TidyBrew's design tokens. */
    .tb{
      --ground:#17120B; --ground-2:#1F1810; --ink:#F1ECE0; --muted:#A8A190; --faint:#7E7666;
      --brown:#B07A45; --brown-lift:#C9985F; --green:#0C7A4E; --green-hi:#12925E;
      --card:#FAF8F3; --card-ink:#232019; --card-muted:#6B6558; --card-line:#E9E3D5; --hair:#332C22;
      --sans:'TBSans','Nunito',-apple-system,'SF Pro Rounded',sans-serif;
      --serif:'TBSerif','Crimson Pro',Georgia,serif;
      --mono:'TBMono','Share Tech Mono',ui-monospace,monospace;
      background:var(--ground); color:var(--ink); font-family:var(--serif);
      line-height:1.6; margin:0; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    .tb *{box-sizing:border-box;}
    .tb img{max-width:100%;display:block;}
    .tb-wrap{max-width:1020px;margin:0 auto;padding:0 26px;}
    .tb-eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brown-lift);margin:0;}
    .tb-rule{height:1px;background:var(--hair);border:0;margin:0;}

    /* Top bar */
    .tb-bar{display:flex;justify-content:space-between;align-items:center;max-width:1020px;margin:0 auto;
      padding:18px 26px;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;}
    .tb-bar a{color:var(--faint);text-decoration:none;}
    .tb-bar a:hover{color:var(--ink);}
    .tb-bar .tb-fam{color:var(--brown-lift);}

    /* Hero */
    .tb-hero{position:relative;text-align:center;padding:40px 0 56px;overflow:hidden;}
    .tb-hero::before{content:'';position:absolute;inset:-10% 0 auto 0;height:340px;
      background:radial-gradient(ellipse 56% 100% at 50% 0%, rgba(176,122,69,.55), rgba(176,122,69,0) 70%);
      pointer-events:none;}
    .tb-mark{position:relative;width:96px;height:96px;border-radius:24px;margin:6px auto 22px;
      box-shadow:0 16px 40px rgba(0,0,0,.45);}
    .tb-word{font-family:var(--sans);font-weight:800;font-size:clamp(2.6rem,6.5vw,4.2rem);letter-spacing:-.02em;
      color:var(--ink);margin:0;line-height:1;}
    .tb-tag{font-family:var(--serif);font-size:clamp(1.2rem,2.6vw,1.6rem);color:#d9cfba;
      max-width:26ch;margin:18px auto 0;line-height:1.4;}
    .tb-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:30px 0 16px;}
    .tb-btn{display:inline-block;padding:14px 26px;border-radius:12px;font-family:var(--sans);font-weight:700;
      font-size:1.02rem;text-decoration:none;transition:transform .15s ease;}
    .tb-btn:hover{transform:translateY(-1px);}
    .tb-btn--go{background:var(--green);color:#fff;}
    .tb-btn--go:hover{background:var(--green-hi);}
    .tb-btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--hair);}
    .tb-hero .tb-eyebrow{color:var(--faint);margin-top:8px;}

    /* Showcase — device shots on a light card, as in the design */
    .tb-show{padding:14px 0 8px;}
    .tb-card{background:#ECE3D2;border-radius:26px;padding:40px 30px 26px;
      box-shadow:0 24px 60px rgba(0,0,0,.35);}
    .tb-card .tb-eyebrow{color:var(--brown);text-align:center;}
    .tb-shots{display:flex;gap:34px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:24px;}
    .tb-shots img{width:min(264px,40vw);filter:drop-shadow(0 18px 32px rgba(0,0,0,.28));}
    .tb-cap{font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--card-muted);
      text-align:center;margin:22px 0 6px;}

    /* Editorial sections */
    .tb-sec{padding:56px 0;}
    .tb-h2{font-family:var(--sans);font-weight:800;font-size:clamp(1.8rem,4vw,2.5rem);letter-spacing:-.015em;
      color:var(--ink);margin:10px 0 0;line-height:1.05;}
    .tb-does{list-style:none;padding:0;margin:34px 0 0;display:grid;gap:22px;max-width:64ch;}
    .tb-does li{position:relative;padding-left:30px;font-family:var(--serif);font-size:1.18rem;line-height:1.55;color:#e6ddcc;}
    .tb-does li::before{content:'';position:absolute;left:0;top:.5em;width:12px;height:12px;border-radius:50%;
      background:var(--brown);}
    .tb-does b{font-family:var(--sans);font-weight:700;color:var(--ink);}

    .tb-note{font-family:var(--serif);font-size:1.1rem;line-height:1.7;color:#cfc6b4;
      border-left:2px solid var(--brown);padding:2px 0 2px 22px;margin:30px 0 0;max-width:64ch;}
    .tb-serif{font-family:var(--serif);font-size:1.12rem;line-height:1.7;color:#cfc6b4;max-width:62ch;margin-top:16px;}

    /* Notify */
    .tb-notify{background:var(--ground-2);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:56px 0;}
    .tb-notify h2{font-family:var(--sans);font-weight:800;font-size:clamp(1.7rem,4vw,2.3rem);color:var(--ink);margin:12px 0 8px;}
    .tb-notify p{font-family:var(--serif);font-size:1.12rem;color:#cfc6b4;max-width:52ch;margin:0 0 22px;}
    .tb-form{display:flex;gap:12px;flex-wrap:wrap;max-width:34rem;}
    .tb-form input{flex:1;min-width:16rem;padding:14px 16px;border:1px solid var(--hair);border-radius:12px;
      background:#120E08;color:var(--ink);font-size:1rem;font-family:var(--serif);}
    .tb-form input::placeholder{color:#8a8272;}
    .tb-form button{padding:14px 26px;border:0;border-radius:12px;background:var(--green);color:#fff;
      font-family:var(--sans);font-weight:700;font-size:1.02rem;cursor:pointer;}
    .tb-form button:hover{background:var(--green-hi);}
    .tb-done{display:none;font-family:var(--sans);font-weight:700;font-size:1.12rem;color:var(--brown-lift);margin:4px 0 0;}
    .tb-notify.is-done .tb-form{display:none;}
    .tb-notify.is-done .tb-done{display:block;}
    .tb-fine{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 0 0;}

    /* Footer */
    .tb-foot{padding:46px 0 70px;}
    .tb-foot p{font-family:var(--serif);font-size:1.05rem;color:#b8af9d;line-height:1.65;max-width:60ch;}
    .tb-foot a{color:var(--brown-lift);text-decoration:none;border-bottom:1px solid var(--hair);}
    .tb-foot a:hover{border-color:var(--brown-lift);}

    @media (max-width:640px){ .tb-shots img{width:72vw;} .tb-card{padding:30px 18px 14px;} }
  </style>
</head>
<body class="tb">
  <div class="tb-bar">
    <a href="{{ '/tools/' | relative_url }}">← The Workbench</a>
    <a class="tb-fam" href="{{ '/tidyapps/' | relative_url }}">A Tidy app</a>
  </div>
  {{ content }}
</body>
</html>
