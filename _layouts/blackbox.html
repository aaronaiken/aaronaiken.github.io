<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f0">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090a">
  <title>{{ page.title }} · Aaron Aiken</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/blackbox/icon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/blackbox/icon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/blackbox/icon-180.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Share+Tech+Mono&family=Crimson+Pro:ital@0;1&display=swap" rel="stylesheet">
  <!-- carries the app's own palette + typography (the "oscilloscope" look) -->
  <link rel="stylesheet" href="{{ '/assets/css/blackbox.css' | relative_url }}">
</head>
<body>
  <header class="bx-hero">
    <img src="{{ '/assets/img/blackbox/icon-180.png' | relative_url }}" alt="Blackbox" width="56" height="56">
    <div>
      <div class="k">{{ page.page_ident | default: "WORK · MEETING INTELLIGENCE" }}</div>
      <h1>{{ page.title }}</h1>
      {% if page.tagline %}<p class="bx-tagline">{{ page.tagline }}</p>{% endif %}
    </div>
    <nav class="bx-nav">
      <a class="bx-back" href="{{ '/work/' | relative_url }}">← Work</a>
      <a class="bx-cta" href="#wi">Want this? ↓</a>
    </nav>
  </header>

  <article class="article">
    {{ content }}
  </article>

  <footer class="bx-foot">
    <span>Built by <a href="{{ '/' | relative_url }}" rel="noopener">Aaron Aiken</a></span>
    <a href="{{ '/work/' | relative_url }}" rel="noopener">More work ↗</a>
  </footer>
</body>
</html>
